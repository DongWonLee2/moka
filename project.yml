name: Moka
options:
  bundleIdPrefix: dev.dongwon
  deploymentTarget:
    macOS: "14.0"
packages:
  Moka:
    path: .
configFiles:
  Debug: App/Config/Signing.xcconfig
  Release: App/Config/Signing.xcconfig
targets:
  Moka:
    type: application
    platform: macOS
    sources: [App/Sources]
    dependencies:
      - package: Moka
        product: MokaCore
      - package: Moka
        product: MokaStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dongwon.moka
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [MokaAppTests]
  # 화면 스냅샷 번들(ADR-0009, D4). 앱을 호스트로 쓰지 않고(TEST_HOST 없음) 뷰만 직접 컴파일한다.
  MokaAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/Sources/Views, App/Tests/MokaAppTests]
    dependencies:
      - package: Moka
        product: MokaCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
